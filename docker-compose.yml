services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memu
      POSTGRES_USER: memu
      POSTGRES_PASSWORD: memu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./memu/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./memu/events_schema.sql:/docker-entrypoint-initdb.d/02-events.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memu"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["--config", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    volumes:
      - natsdata:/data
      - ./infra/local-nats/nats-server.conf:/etc/nats/nats-server.conf
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://memu:memu@postgres:5432/memu
      MEMU_API_KEY: ${MEMU_API_KEY:-memu-dev-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NATS_LOCAL_URL: nats://nats:4222
      NATS_RAILWAY_URL: ${NATS_RAILWAY_URL:-nats://nats:4222}
      NATS_RAILWAY_AUTH_TOKEN: ${NATS_RAILWAY_AUTH_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  bridge:
    build: .
    command: ["python", "-m", "memu.ws_bridge"]
    ports:
      - "8001:8001"
    environment:
      NATS_LOCAL_URL: nats://nats:4222
      NATS_RAILWAY_URL: ${NATS_RAILWAY_URL:-nats://nats:4222}
      NATS_RAILWAY_AUTH_TOKEN: ${NATS_RAILWAY_AUTH_TOKEN:-}
    depends_on:
      nats:
        condition: service_healthy

  event_consumer:
    build: .
    command: ["python", "-m", "memu.event_consumer"]
    restart: unless-stopped
    environment:
      NATS_LOCAL_URL: nats://nats:4222
      NATS_RAILWAY_URL: ${NATS_RAILWAY_URL:-nats://nats:4222}
      NATS_RAILWAY_AUTH_TOKEN: ${NATS_RAILWAY_AUTH_TOKEN:-}
      MEMU_API_URL: http://api:8000
      MEMU_API_KEY: ${MEMU_API_KEY:-memu-dev-key}
      SUMMARY_INTERVAL: ${SUMMARY_INTERVAL:-30}
      AGENT_ID: event_consumer
      ENABLE_MEMU_WRITES: ${ENABLE_MEMU_WRITES:-true}
      AGENT_EVENTS_STREAM: AGENT_EVENTS
      AGENT_EVENTS_CONSUMER: MEMU_DEFAULT_CONSUMER
    depends_on:
      nats:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
  natsdata:
