services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memu
      POSTGRES_USER: memu
      POSTGRES_PASSWORD: memu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./memu/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./memu/events_schema.sql:/docker-entrypoint-initdb.d/02-events.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memu"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    restart: unless-stopped
    image: nats:2.10-alpine
    command: ["--config", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    volumes:
      - natsdata:/data
      - ./infra/local-nats/nats-server.conf:/etc/nats/nats-server.conf
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    restart: unless-stopped
    image: ollama/ollama:latest
    command: ["serve"]
    environment:
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 5s
      retries: 5

  api:
    restart: unless-stopped
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://memu:memu@postgres:5432/memu
      MEMU_API_KEY: ${MEMU_API_KEY:-memu-dev-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-4096}
      NATS_LOCAL_URL: nats://nats:4222
      NATS_RAILWAY_URL: ${NATS_RAILWAY_URL:-nats://nats:4222}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      ollama:
        condition: service_started

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgres12_pgx
      - DB_PORT=5432
      - POSTGRES_USER=memu
      - POSTGRES_PWD=memu
      - POSTGRES_DB=temporal
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  temporal-worker:
    build: .
    command: ["python", "-m", "memu.temporal_worker.worker"]
    environment:
      TEMPORAL_HOST: temporal:7233
      DATABASE_URL: postgresql://memu:memu@postgres:5432/memu
    depends_on:
      temporal:
        condition: service_started
      api:
        condition: service_started

  warden:
    restart: unless-stopped
    build: .
    working_dir: /app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NATS_LOCAL_URL: nats://nats:4222
      NATS_RAILWAY_URL: ${NATS_RAILWAY_URL:-nats://nats:4222}
      WARDEN_GATEWAY_IMAGE: ${WARDEN_GATEWAY_IMAGE:-fumemory-gateway:latest}
      WARDEN_HEARTBEAT_TTL: ${WARDEN_HEARTBEAT_TTL:-8}
      WARDEN_CHECK_INTERVAL: ${WARDEN_CHECK_INTERVAL:-2}
      WARDEN_RESPAWN_COOLDOWN_S: ${WARDEN_RESPAWN_COOLDOWN_S:-30}
      WARDEN_LOG_LEVEL: ${WARDEN_LOG_LEVEL:-INFO}
    command: ["python", "-m", "memu.warden_runtime"]
    depends_on:
      nats:
        condition: service_healthy

  bridge:
    restart: unless-stopped
    build: .
    command: ["python", "-m", "memu.ws_bridge"]

  event-consumer:
    restart: unless-stopped
    build: .
    command: ["python", "-m", "memu.event_consumer"]
    environment:
      NATS_LOCAL_URL: nats://nats:4222
      NATS_RAILWAY_URL: ${NATS_RAILWAY_URL:-nats://nats:4222}
      SUMMARY_INTERVAL_SECONDS: "30"
    depends_on:
      nats:
        condition: service_healthy


  notion_poller:
    restart: unless-stopped
    build: .
    command: python -m memu.notion_poller
    environment:
      - NOTION_API_KEY=${NOTION_API_KEY}
      - MEMU_BASE_URL=http://api:8000
      - MEMU_API_KEY=${MEMU_API_KEY}
      - AGENT_ID=${AGENT_ID:-any}
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
    depends_on:
      - api

  projector:
    restart: unless-stopped
    build: .
    command: ["python", "-m", "memu.projector"]
    environment:
      NATS_URL: nats://nats:4222
      MEMU_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
      nats:
        condition: service_healthy

volumes:
  pgdata:
  natsdata:
  ollamadata:
