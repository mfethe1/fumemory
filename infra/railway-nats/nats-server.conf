# NATS Server Configuration — fumemory swarm mesh
# Railway fallback instance

# Server identity
server_name: fumemory-railway

# Client connections
port: 4222

# HTTP monitoring (Railway health checks)
http_port: 8222

# JetStream — persistent event streams
jetstream {
    store_dir: /data/jetstream
    max_mem: 256MB
    max_file: 1GB
}

# Logging
debug: false
trace: false
logtime: true

# Connection limits
max_connections: 256
max_payload: 1MB

# Ping/pong for dead connection detection
ping_interval: 20s
ping_max: 3

# Authorization (required in Railway — inject NATS_AUTH_TOKEN via Railway env vars)
authorization {
    token: $NATS_AUTH_TOKEN
}
