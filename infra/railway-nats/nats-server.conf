# NATS Server Configuration — fumemory swarm mesh
# Railway fallback instance

# Server identity
server_name: fumemory-railway

# Client connections
port: 4222

# HTTP monitoring (Railway health checks)
http_port: 8222

# JetStream — persistent event streams
jetstream {
    store_dir: /data/jetstream
}

# Logging
debug: false
trace: false
logtime: true

# Connection limits
max_connections: 256
max_payload: 1MB

# Ping/pong for dead connection detection
ping_interval: 20
ping_max: 3

# Authorization (optional — enable via NATS_AUTH_TOKEN env var)
# Uncomment and set token for zero-trust:
# authorization {
#     token: $NATS_AUTH_TOKEN
# }
