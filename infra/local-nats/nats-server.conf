# NATS Server Configuration — fumemory swarm mesh
# Local PRIMARY instance (low latency, fast path)

server_name: fumemory-local

port: 4222
http_port: 8222

jetstream {
    store_dir: /data/jetstream
}

debug: false
trace: false
logtime: true

max_connections: 256
max_payload: 1MB

ping_interval: 20
ping_max: 3
