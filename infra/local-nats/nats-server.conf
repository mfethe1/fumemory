# NATS Server Configuration — fumemory swarm mesh
# Local PRIMARY instance (low latency, fast path)
# Keep this file compatible with both:
# - docker-compose mount path (/data/jetstream)
# - infra/local-nats/start.sh local dev path (overridden via --store_dir)

server_name: fumemory-local

port: 4222
monitor_port: 8222

jetstream {
    store_dir: /data/jetstream
    max_mem: 512MB
    max_file: 2GB
}

# NKey authentication — Ed25519 user keypair, no PKI required.
# Setup: run infra/local-nats/gen-nkeys.sh to generate a keypair, then:
#   1. Replace the nkey value below with the generated public key (starts with 'U').
#   2. Add the seed to .env: NATS_LOCAL_NKEY_SEED=<seed starting with 'SU'>
# Unauthenticated connections will be rejected once this block is active.
authorization {
    users: [
        { nkey: "UAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }
    ]
}

debug: false
trace: false
logtime: true

max_connections: 256
max_payload: 1MB

ping_interval: 20s
ping_max: 3
