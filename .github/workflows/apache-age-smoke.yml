name: Apache AGE smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'memu/**'
      - 'tests/test_apache_age*'
      - '.github/workflows/apache-age-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'memu/**'
      - 'tests/test_apache_age*'
      - '.github/workflows/apache-age-smoke.yml'

jobs:
  age-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGE_TEST_DATABASE_URL: ${{ secrets.AGE_TEST_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Apache AGE suite
        shell: bash
        run: |
          if [ -z "${AGE_TEST_DATABASE_URL}" ]; then
            echo "AGE_TEST_DATABASE_URL secret is not configured; skipping live Apache AGE smoke tests."
            exit 0
          fi

          python -m pytest \
            tests/test_apache_age.py \
            tests/test_apache_age_api_validation.py \
            tests/test_apache_age_graph_neighbors.py \
            tests/test_apache_age_graph_path.py \
            tests/test_apache_age_sync_trigger_sql.py \
            tests/test_apache_age_integration_smoke.py \
            -q
