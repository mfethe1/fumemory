name: baseline

on:
  push:
    branches:
      - main
      - 'lenny/**'
      - 'macklemore/**'
      - 'rosie/**'
      - 'winnie/**'
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NATS server
        run: |
          set -euo pipefail
          VERSION=2.12.4
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${VERSION}/nats-server-v${VERSION}-linux-amd64.tar.gz" \
            | tar -xz
          sudo mv "nats-server-v${VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify baseline
        run: ./scripts/verify_baseline.sh
